# The backend, split into one crate per hexagon layer so the compiler
# enforces which way dependencies point: adapters depend on the
# application, the application on the domain, and the domain on nothing
# of theirs.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
swarm-domain = { path = "crates/swarm-domain" }
swarm-application = { path = "crates/swarm-application" }
swarm-github = { path = "crates/swarm-github" }

async-trait = "0.1.92"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.29.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
