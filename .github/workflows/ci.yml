name: ci

# Every test there is, each level a job of its own: the backend's unit and
# integration tests (those needing Docker included, which the runner has),
# the web panel's, and then the whole system end to end: the panel's
# container built from this repository, given Docker, driven in a browser.
#
# Jobs run on the repository variable CI_RUNS_ON when it is set, so they can
# be moved off GitHub's runners (onto a self-hosted one, run by this very
# panel, say) without editing this file; on ubuntu-latest otherwise.
#
# `make ci` runs this workflow on this machine, with act.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (fmt, clippy, unit and integration tests)
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # --include-ignored: the Docker runtime's tests too, which need an
      # engine and are left out of a plain `cargo test`.
      - name: Run the unit and integration tests
        run: cargo test --workspace --locked -- --include-ignored

  web:
    name: web (typecheck, unit and integration tests, build)
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Check the types
        run: npm run typecheck

      - name: Run the unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: e2e (the panel's container, Docker and a browser)
    needs: [backend, web]
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            web/package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the stand-in runner image and the panel's, starts the panel,
      # and leaves it up (E2E_KEEP) for the contract test after.
      - name: Run the end-to-end tests
        env:
          E2E_KEEP: "1"
        run: npm test

      - name: Hold the web panel's types to the API the panel serves
        working-directory: web
        env:
          GRS_API: http://127.0.0.1:18090/api
        run: |
          npm ci
          npm run test:contract

      - name: Stop the panel
        if: always()
        run: docker compose --file compose.yaml down

      - name: Upload the report and traces of what failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
