# The backend, split into one crate per hexagon layer so the compiler
# enforces which way dependencies point: adapters depend on the
# application, the application on the domain, and the domain on nothing
# of theirs.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
swarm-domain = { path = "crates/swarm-domain" }
swarm-application = { path = "crates/swarm-application" }
swarm-docker = { path = "crates/swarm-docker" }
swarm-github = { path = "crates/swarm-github" }
swarm-http = { path = "crates/swarm-http" }
swarm-memory = { path = "crates/swarm-memory" }
swarm-server = { path = "crates/swarm-server" }

async-trait = "0.1.92"
axum = "0.8.9"
bollard = { version = "0.21.1", features = ["time"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.29.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
